<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero Dive Bar — War Stats</title>
<style>
:root{
  --bg:#0c1118;--panel:#151c26;--panel2:#1b2431;--line:#2b3544;
  --text:#edf2f7;--muted:#8fa0b5;--accent:#8b5cf6;--accent2:#a78bfa;
  --good:#37c96b;--warn:#f2bd4c;--bad:#ff6b6b
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
header{background:#0c1118ee;position:sticky;top:0;border-bottom:1px solid var(--line);z-index:10}
.wrap{max-width:1100px;margin:auto;padding:18px 20px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#4f46e5);font-size:22px}
h1{font-size:30px;margin:0 0 18px} h2{font-size:21px;margin:28px 0 12px} h3{font-size:17px;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:12px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
nav button{border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:650}
nav button.active,nav button:hover{background:var(--panel);color:var(--text)}
main{max-width:1100px;margin:auto;padding:22px 20px 60px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}.s3{grid-column:span 3}
.kicker{text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-size:11px;font-weight:800}
.big{font-size:31px;font-weight:850;margin-top:5px}.score{font-size:42px;font-weight:900}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--panel2);font-size:12px}
.pill.filler{background:#3b2a16;color:#f2cc60}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
tr:last-child td{border-bottom:0}
.hide{display:none}
.error{padding:14px;background:#321b1b;border:1px solid #693434;border-radius:10px}
.player-link{color:var(--text);font-weight:750;text-decoration:none;cursor:pointer}
.player-link:hover{color:var(--accent2);text-decoration:underline}
.back-link{display:inline-flex;align-items:center;gap:7px;color:var(--accent2);text-decoration:none;font-weight:700;margin-bottom:16px}
.back-link:hover{text-decoration:underline}
.war-entry{border-top:1px solid var(--line);padding:15px 0}
.war-entry:first-child{border-top:0;padding-top:0}
.attack-chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);padding:8px 10px;border-radius:9px;margin:5px 7px 0 0}
.statbar{display:flex;gap:18px;flex-wrap:wrap}
.statbar>div{min-width:110px}
.empty{padding:20px 0;color:var(--muted)}
@media(max-width:760px){
  .s8,.s6,.s4,.s3{grid-column:span 12}
  .score{font-size:34px}
  table{display:block;overflow-x:auto}
}
</style>
</head>
<body>
<header>
<div class="wrap">
  <div class="row between">
    <div class="brand">
      <div class="logo">⚔</div>
      <div><b>Hero Dive Bar</b><div class="muted small">Public War Dashboard</div></div>
    </div>
    <div id="updated" class="muted small">Loading…</div>
  </div>
  <nav>
    <button class="active" data-tab="home">Dashboard</button>
    <button data-tab="wars">Regular Wars</button>
    <button data-tab="players">Players</button>
    <button data-tab="cwl">CWL</button>
  </nav>
</div>
</header>

<main>
<div id="error"></div>
<section id="home"></section>
<section id="wars" class="hide"></section>
<section id="players" class="hide"></section>
<section id="cwl" class="hide"></section>
<section id="profile" class="hide"></section>
</main>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g,m=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[m]));

const pct = n => Number(n || 0).toFixed(1);
const avg = n => Number(n || 0).toFixed(2);
const stars = n => '★'.repeat(Number(n||0)) + '☆'.repeat(Math.max(0,3-Number(n||0)));

let DATA = null;
let ACTIVE_TAB = 'home';

function showSection(id){
  document.querySelectorAll('main section').forEach(x=>x.classList.add('hide'));
  const el=document.getElementById(id);
  if(el) el.classList.remove('hide');

  document.querySelectorAll('nav button').forEach(x=>{
    x.classList.toggle('active', x.dataset.tab===id);
  });
  ACTIVE_TAB=id;
}

document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{
  history.replaceState(null,'',location.pathname);
  showSection(b.dataset.tab);
}));

function playerHref(id){
  return `#player=${encodeURIComponent(id)}`;
}

function playerLink(name,id){
  return `<a class="player-link" href="${playerHref(id)}" data-player-id="${esc(id)}">${esc(name)}</a>`;
}

function bindPlayerLinks(){
  document.querySelectorAll('[data-player-id]').forEach(a=>{
    a.addEventListener('click',e=>{
      e.preventDefault();
      const id=a.dataset.playerId;
      location.hash=`player=${encodeURIComponent(id)}`;
      renderPlayerProfile(id);
    });
  });
}

function prettyDate(v){
  if(!v || v.length<8) return v || '—';
  return `${v.slice(4,6)}/${v.slice(6,8)}/${v.slice(0,4)}`;
}

function render(d){
  DATA=d;
  document.getElementById('updated').textContent = d.generated_at
    ? `Updated ${new Date(d.generated_at).toLocaleString()}`
    : 'Updated';

  const w=d.current_war;
  let home='<h1>Dashboard</h1>';

  if(w){
    home+=`<div class="grid">
      <div class="card s8">
        <div class="kicker">${esc(w.state_label)} · ${w.team_size}v${w.team_size}</div>
        <h2 style="margin-top:8px">${esc(w.clan_name)} <span class="muted">vs</span> ${esc(w.opponent_name)}</h2>
        <div class="row">
          <div><div class="score">${w.clan_stars} ★</div><div class="muted">${Number(w.clan_destruction).toFixed(2)}%</div></div>
          <div class="muted">—</div>
          <div><div class="score">${w.opponent_stars} ★</div><div class="muted">${Number(w.opponent_destruction).toFixed(2)}%</div></div>
        </div>
      </div>
      <div class="card s4">
        <div class="kicker">Expected clan attacks</div>
        <div class="big">${w.attacks_used} / ${w.expected_attacks}</div>
        <div class="muted">${w.fillers} filler${w.fillers===1?'':'s'} excluded from expected attacks.</div>
        <div style="margin-top:10px"><b>${w.remaining_attacks}</b> expected attack${w.remaining_attacks===1?'':'s'} remaining</div>
      </div>
    </div>`;

    home+='<h2>Current War Roster</h2><div class="card"><table><thead><tr><th>#</th><th>Player</th><th>TH</th><th>Status</th><th>Used</th><th>Expected</th><th>';
    home += w.state==='warEnded' ? 'Missed' : 'Remaining';
    home += '</th></tr></thead><tbody>';

    for(const p of w.roster||[]){
      const status=p.is_filler
        ? '<span class="pill filler">Filler</span>'
        : '<span class="pill">Normal</span>';
      const finalCol=w.state==='warEnded' ? p.missed_attacks : p.remaining_attacks;
      const cls=finalCol>0 && !p.is_filler ? (w.state==='warEnded'?'bad':'warn') : '';
      home+=`<tr>
        <td>#${p.map_position}</td>
        <td>${playerLink(p.name,p.public_id)}</td>
        <td>TH${p.th}</td>
        <td>${status}</td>
        <td>${p.attacks_used}</td>
        <td>${p.expected_attacks}</td>
        <td class="${cls}">${finalCol}</td>
      </tr>`;
    }
    home+='</tbody></table></div>';
  } else {
    home+='<div class="card">No current war stored.</div>';
  }

  home+='<h2>Recent Results</h2><div class="card"><table><thead><tr><th>Opponent</th><th>Size</th><th>Score</th><th>Fillers</th><th>Missed</th><th>Result</th></tr></thead><tbody>';
  for(const x of d.recent_wars||[]){
    const cls=x.result==='win'?'good':x.result==='loss'?'bad':'';
    home+=`<tr>
      <td>${esc(x.opponent_name)}</td>
      <td>${x.team_size}v${x.team_size}</td>
      <td>${x.clan_stars}–${x.opponent_stars}</td>
      <td>${x.filler_count}</td>
      <td>${x.missed_attacks}</td>
      <td class="${cls}">${esc((x.result||x.state_label).toUpperCase())}</td>
    </tr>`;
  }
  home+='</tbody></table></div>';
  document.getElementById('home').innerHTML=home;

  let wars='<h1>Regular Wars</h1><div class="card"><table><thead><tr><th>Date</th><th>Opponent</th><th>Size</th><th>Stars</th><th>Destruction</th><th>Fillers</th><th>Missed</th><th>Result</th></tr></thead><tbody>';
  for(const x of d.wars||[]){
    wars+=`<tr>
      <td>${prettyDate(x.date)}</td>
      <td>${esc(x.opponent_name)}</td>
      <td>${x.team_size}v${x.team_size}</td>
      <td>${x.clan_stars}–${x.opponent_stars}</td>
      <td>${Number(x.clan_destruction).toFixed(1)}%–${Number(x.opponent_destruction).toFixed(1)}%</td>
      <td>${x.filler_count}</td>
      <td>${x.missed_attacks}</td>
      <td>${esc((x.result||x.state_label).toUpperCase())}</td>
    </tr>`;
  }
  wars+='</tbody></table></div>';
  document.getElementById('wars').innerHTML=wars;

  let players='<h1>Players</h1><div class="card"><table><thead><tr><th>Player</th><th>TH</th><th>Wars</th><th>Attacks</th><th>Missed</th><th>3★</th><th>Triple Rate</th><th>Avg Stars</th><th>Avg Destruction</th></tr></thead><tbody>';
  for(const p of d.players||[]){
    const mcls=p.missed_attacks>0?'bad':'';
    players+=`<tr>
      <td>${playerLink(p.name,p.public_id)}</td>
      <td>TH${p.th}</td>
      <td>${p.wars}</td>
      <td>${p.attacks}</td>
      <td class="${mcls}">${p.missed_attacks}</td>
      <td>${p.triples}</td>
      <td>${pct(p.triple_rate)}%</td>
      <td>${avg(p.avg_stars)}</td>
      <td>${pct(p.avg_destruction)}%</td>
    </tr>`;
  }
  players+='</tbody></table><div class="muted small" style="margin-top:14px">Click any player to open their full public regular-war history.</div></div>';
  document.getElementById('players').innerHTML=players;

  document.getElementById('cwl').innerHTML='<h1>CWL</h1><div class="card">CWL public statistics will appear here once the separate CWL collector is enabled.</div>';

  bindPlayerLinks();
  routeFromHash();
}

function resultClass(r){
  if(r==='win') return 'good';
  if(r==='loss') return 'bad';
  return '';
}

function renderPlayerProfile(id){
  if(!DATA) return;
  const p=(DATA.player_profiles||{})[id];
  if(!p){
    showSection('players');
    return;
  }

  const tr = Number(p.triple_rate||0).toFixed(1);
  let profile=`
    <a class="back-link" href="#" id="backPlayers">← Back to Players</a>
    <div class="row between">
      <div>
        <h1 style="margin-bottom:5px">${esc(p.name)}</h1>
        <div class="muted">TH${p.th} · Regular War History</div>
      </div>
    </div>

    <div class="grid" style="margin-top:18px">
      <div class="card s3"><div class="kicker">Wars</div><div class="big">${p.wars}</div></div>
      <div class="card s3"><div class="kicker">Attacks</div><div class="big">${p.attacks}</div></div>
      <div class="card s3"><div class="kicker">Triples</div><div class="big">${p.triples}</div><div class="muted">${tr}%</div></div>
      <div class="card s3"><div class="kicker">Missed</div><div class="big">${p.missed_attacks}</div></div>
    </div>

    <div class="grid" style="margin-top:14px">
      <div class="card s4"><div class="kicker">Average Stars</div><div class="big">${avg(p.avg_stars)}</div></div>
      <div class="card s4"><div class="kicker">Avg Destruction</div><div class="big">${pct(p.avg_destruction)}%</div></div>
      <div class="card s4">
        <div class="kicker">Star Distribution</div>
        <div style="margin-top:10px">3★ ${p.triples} &nbsp; 2★ ${p.twos} &nbsp; 1★ ${p.ones} &nbsp; 0★ ${p.zeros}</div>
      </div>
    </div>

    <h2>War-by-War History</h2>
    <div class="card" id="profileHistory">
  `;

  if(!(p.war_history||[]).length){
    profile+='<div class="empty">No regular-war history has been stored yet.</div>';
  }

  for(const w of p.war_history||[]){
    const role=w.is_filler
      ? '<span class="pill filler">Filler</span>'
      : '<span class="pill">Normal</span>';

    const missed = w.state==='warEnded'
      ? `<span class="${w.missed_attacks>0?'bad':''}">${w.missed_attacks} missed</span>`
      : `${Math.max(0,w.expected_attacks-w.attacks_used)} remaining`;

    let attackHtml='';
    if((w.attacks||[]).length){
      for(const a of w.attacks){
        attackHtml += `<span class="attack-chip">
          <b>A${a.number}: ${stars(a.stars)}</b> ${pct(a.destruction)}%
          <span class="muted">· ${esc((a.attack_type||'').charAt(0).toUpperCase()+(a.attack_type||'').slice(1))}</span>
        </span>`;
      }
    } else {
      attackHtml='<span class="muted">No attacks recorded.</span>';
    }

    const score = `${w.our_stars}–${w.their_stars}`;
    const res = w.result ? w.result.toUpperCase() : w.state_label;

    profile+=`
      <div class="war-entry">
        <div class="row between">
          <div>
            <b>vs ${esc(w.opponent_name)}</b>
            <div class="muted small">${prettyDate(w.date)} · ${w.team_size}v${w.team_size} · TH${w.th}</div>
          </div>
          <div style="text-align:right">
            <div class="${resultClass(w.result)}"><b>${esc(res)}</b> · ${score}</div>
            <div style="margin-top:5px">${role}</div>
          </div>
        </div>
        <div class="statbar" style="margin-top:12px">
          <div><span class="muted small">Used</span><br><b>${w.attacks_used}/${w.expected_attacks}</b></div>
          <div><span class="muted small">${w.state==='warEnded'?'Missed':'Status'}</span><br><b>${missed}</b></div>
        </div>
        <div style="margin-top:10px">${attackHtml}</div>
      </div>
    `;
  }

  profile+='</div><div class="muted small" style="margin-top:14px">Targeting judgments, overreach/down-hit flags, and management notes remain private.</div>';

  document.getElementById('profile').innerHTML=profile;
  showSection('profile');

  const back=document.getElementById('backPlayers');
  if(back){
    back.addEventListener('click',e=>{
      e.preventDefault();
      history.replaceState(null,'',location.pathname);
      showSection('players');
    });
  }
}

function routeFromHash(){
  if(!DATA) return;
  const h=location.hash.replace(/^#/,'');
  if(h.startsWith('player=')){
    const id=decodeURIComponent(h.slice(7));
    renderPlayerProfile(id);
  }
}

window.addEventListener('hashchange',routeFromHash);

fetch('data.json?ts='+Date.now(),{cache:'no-store'})
  .then(r=>{
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })
  .then(render)
  .catch(e=>{
    document.getElementById('error').innerHTML=`<div class="error">Could not load dashboard data: ${esc(e.message)}</div>`;
  });
</script>
</body>
</html>
