<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero Dive Bar — War Stats</title>
<style>
:root{
  --bg:#0c1118;--panel:#151c26;--panel2:#1b2431;--line:#2b3544;
  --text:#edf2f7;--muted:#8fa0b5;--accent:#8b5cf6;--accent2:#a78bfa;
  --good:#37c96b;--warn:#f2bd4c;--bad:#ff6b6b
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
header{background:#0c1118ee;position:sticky;top:0;border-bottom:1px solid var(--line);z-index:10}
.wrap{max-width:1100px;margin:auto;padding:18px 20px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#4f46e5);font-size:22px}
h1{font-size:30px;margin:0 0 18px} h2{font-size:21px;margin:28px 0 12px} h3{font-size:17px;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:12px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
nav button{border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:650}
nav button.active,nav button:hover{background:var(--panel);color:var(--text)}
main{max-width:1100px;margin:auto;padding:22px 20px 60px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}.s3{grid-column:span 3}
.kicker{text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-size:11px;font-weight:800}
.big{font-size:31px;font-weight:850;margin-top:5px}.score{font-size:42px;font-weight:900}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--panel2);font-size:12px}
.pill.filler{background:#3b2a16;color:#f2cc60}.pill.us{background:#173421;color:#73e59a}.pill.them{background:#3a2020;color:#ff9999}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
tr:last-child td{border-bottom:0}
.hide{display:none}.error{padding:14px;background:#321b1b;border:1px solid #693434;border-radius:10px}
.player-link{color:var(--text);font-weight:750;text-decoration:none;cursor:pointer}
.player-link:hover{color:var(--accent2);text-decoration:underline}
.back-link{display:inline-flex;align-items:center;gap:7px;color:var(--accent2);text-decoration:none;font-weight:700;margin-bottom:16px}
.back-link:hover{text-decoration:underline}
.war-entry{border-top:1px solid var(--line);padding:15px 0}.war-entry:first-child{border-top:0;padding-top:0}
.attack-chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);padding:8px 10px;border-radius:9px;margin:5px 7px 0 0}
.statbar{display:flex;gap:18px;flex-wrap:wrap}.statbar>div{min-width:110px}
.empty{padding:20px 0;color:var(--muted)}
.timeline{position:relative;margin-top:6px}.timeline:before{content:"";position:absolute;left:16px;top:10px;bottom:10px;width:2px;background:var(--line)}
.timeline-item{position:relative;padding:0 0 18px 46px}.timeline-item:last-child{padding-bottom:0}
.timeline-dot{position:absolute;left:9px;top:5px;width:16px;height:16px;border-radius:50%;background:var(--panel2);border:3px solid var(--line)}
.timeline-item.ours .timeline-dot{border-color:var(--good)}.timeline-item.theirs .timeline-dot{border-color:var(--bad)}
.timeline-score{font-weight:850}.compare-controls{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px;font-size:15px}
.compare-vs{padding-bottom:11px;color:var(--muted);font-weight:800}
.compare-name{font-size:20px;font-weight:850}.compare-stat{display:grid;grid-template-columns:1fr 130px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.compare-stat:first-child{border-top:0}.compare-stat .mid{text-align:center;color:var(--muted);font-size:12px;text-transform:uppercase}
.compare-stat .right{text-align:right}
.record-note{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:760px){
  .s8,.s6,.s4,.s3{grid-column:span 12}.score{font-size:34px}
  table{display:block;overflow-x:auto}
  .compare-controls{grid-template-columns:1fr}.compare-vs{text-align:center;padding:0}
  .compare-stat{grid-template-columns:1fr 90px 1fr}
}
</style>
</head>
<body>
<header>
<div class="wrap">
  <div class="row between">
    <div class="brand"><div class="logo">⚔</div><div><b>Hero Dive Bar</b><div class="muted small">Public War Dashboard</div></div></div>
    <div id="updated" class="muted small">Loading…</div>
  </div>
  <nav>
    <button class="active" data-tab="home">Dashboard</button>
    <button data-tab="wars">Regular Wars</button>
    <button data-tab="players">Players</button>
    <button data-tab="compare">Compare</button>
    <button data-tab="cwl">CWL</button>
  </nav>
</div>
</header>
<main>
<div id="error"></div>
<section id="home"></section>
<section id="wars" class="hide"></section>
<section id="players" class="hide"></section>
<section id="compare" class="hide"></section>
<section id="cwl" class="hide"></section>
<section id="profile" class="hide"></section>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pct=n=>Number(n||0).toFixed(1);
const avg=n=>Number(n||0).toFixed(2);
const stars=n=>'★'.repeat(Number(n||0))+'☆'.repeat(Math.max(0,3-Number(n||0)));
let DATA=null;

function showSection(id){
  document.querySelectorAll('main section').forEach(x=>x.classList.add('hide'));
  document.getElementById(id)?.classList.remove('hide');
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));
}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{
  history.replaceState(null,'',location.pathname);
  showSection(b.dataset.tab);
}));

const playerLink=(name,id)=>`<a class="player-link" href="#player=${encodeURIComponent(id)}" data-player-id="${esc(id)}">${esc(name)}</a>`;
function bindPlayerLinks(){
  document.querySelectorAll('[data-player-id]').forEach(a=>a.addEventListener('click',e=>{
    e.preventDefault();location.hash=`player=${encodeURIComponent(a.dataset.playerId)}`;renderPlayerProfile(a.dataset.playerId);
  }));
}
function prettyDate(v){return (!v||v.length<8)?(v||'—'):`${v.slice(4,6)}/${v.slice(6,8)}/${v.slice(0,4)}`;}
function resultClass(r){return r==='win'?'good':r==='loss'?'bad':'';}

function renderTimeline(w){
  const t=w?.timeline||[];
  let h='<h2>War Timeline</h2><div class="card">';
  if(!t.length){
    h+='<div class="empty">No attacks yet. The timeline will build automatically during Battle Day.</div></div>';
    return h;
  }
  h+='<div class="timeline">';
  for(const e of t){
    const ours=e.side==='clan';
    const who=ours&&e.attacker_public_id?playerLink(e.attacker_name,e.attacker_public_id):esc(e.attacker_name);
    h+=`<div class="timeline-item ${ours?'ours':'theirs'}">
      <div class="timeline-dot"></div>
      <div class="row between">
        <div><span class="pill ${ours?'us':'them'}">${ours?'Hero Dive Bar':'Opponent'}</span>
        <b style="margin-left:7px">${who}</b> <span class="muted">#${e.attacker_position} → #${e.defender_position}</span></div>
        <div class="timeline-score">${e.our_score_after}–${e.their_score_after}</div>
      </div>
      <div style="margin-top:6px">${stars(e.stars)} <b>${pct(e.destruction)}%</b>
      <span class="muted">· ${esc(e.attack_type)}${e.new_stars?` · +${e.new_stars} war star${e.new_stars===1?'':'s'}`:''}</span></div>
    </div>`;
  }
  h+='</div></div>';
  return h;
}

function render(d){
  DATA=d;
  document.getElementById('updated').textContent=d.generated_at?`Updated ${new Date(d.generated_at).toLocaleString()}`:'Updated';
  const w=d.current_war;
  const rec=d.clan?.records||{};
  let home='<h1>Dashboard</h1>';

  if(w){
    home+=`<div class="grid">
      <div class="card s8"><div class="kicker">${esc(w.state_label)} · ${w.team_size}v${w.team_size}</div>
      <h2 style="margin-top:8px">${esc(w.clan_name)} <span class="muted">vs</span> ${esc(w.opponent_name)}</h2>
      <div class="row"><div><div class="score">${w.clan_stars} ★</div><div class="muted">${Number(w.clan_destruction).toFixed(2)}%</div></div>
      <div class="muted">—</div><div><div class="score">${w.opponent_stars} ★</div><div class="muted">${Number(w.opponent_destruction).toFixed(2)}%</div></div></div></div>
      <div class="card s4"><div class="kicker">Expected clan attacks</div><div class="big">${w.attacks_used} / ${w.expected_attacks}</div>
      <div class="muted">${w.fillers} filler${w.fillers===1?'':'s'} excluded.</div><div style="margin-top:10px"><b>${w.remaining_attacks}</b> expected attacks remaining</div></div>
    </div>`;
  }

  home+=`<h2>Clan Streaks</h2><div class="grid">
    <div class="card s6"><div class="kicker">Longest Win Streak</div><div class="big">${rec.longest_win_streak||0}</div><div class="record-note">Consecutive completed regular-war wins since tracking began.</div></div>
    <div class="card s6"><div class="kicker">Current Win Streak</div><div class="big">${rec.current_win_streak||0}</div><div class="record-note">${rec.completed_wars_tracked||0} completed regular wars tracked.</div></div>
  </div>`;

  if(w){
    home+='<h2>Current War Roster</h2><div class="card"><table><thead><tr><th>#</th><th>Player</th><th>TH</th><th>Status</th><th>Used</th><th>Expected</th><th>';
    home+=w.state==='warEnded'?'Missed':'Remaining';
    home+='</th></tr></thead><tbody>';
    for(const p of w.roster||[]){
      const status=p.is_filler?'<span class="pill filler">Filler</span>':'<span class="pill">Normal</span>';
      const finalCol=w.state==='warEnded'?p.missed_attacks:p.remaining_attacks;
      const cls=finalCol>0&&!p.is_filler?(w.state==='warEnded'?'bad':'warn'):'';
      home+=`<tr><td>#${p.map_position}</td><td>${playerLink(p.name,p.public_id)}</td><td>TH${p.th}</td><td>${status}</td><td>${p.attacks_used}</td><td>${p.expected_attacks}</td><td class="${cls}">${finalCol}</td></tr>`;
    }
    home+='</tbody></table></div>';
    home+=renderTimeline(w);
  }

  home+='<h2>Recent Results</h2><div class="card"><table><thead><tr><th>Opponent</th><th>Size</th><th>Score</th><th>Fillers</th><th>Missed</th><th>Result</th></tr></thead><tbody>';
  for(const x of d.recent_wars||[]){
    home+=`<tr><td>${esc(x.opponent_name)}</td><td>${x.team_size}v${x.team_size}</td><td>${x.clan_stars}–${x.opponent_stars}</td><td>${x.filler_count}</td><td>${x.missed_attacks}</td><td class="${resultClass(x.result)}">${esc((x.result||x.state_label).toUpperCase())}</td></tr>`;
  }
  home+='</tbody></table></div>';
  document.getElementById('home').innerHTML=home;

  let wars='<h1>Regular Wars</h1><div class="card"><table><thead><tr><th>Date</th><th>Opponent</th><th>Size</th><th>Stars</th><th>Destruction</th><th>Fillers</th><th>Missed</th><th>Result</th></tr></thead><tbody>';
  for(const x of d.wars||[]){
    wars+=`<tr><td>${prettyDate(x.date)}</td><td>${esc(x.opponent_name)}</td><td>${x.team_size}v${x.team_size}</td><td>${x.clan_stars}–${x.opponent_stars}</td><td>${pct(x.clan_destruction)}%–${pct(x.opponent_destruction)}%</td><td>${x.filler_count}</td><td>${x.missed_attacks}</td><td class="${resultClass(x.result)}">${esc((x.result||x.state_label).toUpperCase())}</td></tr>`;
  }
  wars+='</tbody></table></div>';
  document.getElementById('wars').innerHTML=wars;

  let players='<h1>Players</h1><div class="card"><table><thead><tr><th>Player</th><th>TH</th><th>Wars</th><th>Attacks</th><th>Missed</th><th>3★</th><th>Triple Rate</th><th>No-Miss Streak</th><th>Triple Streak</th><th>Volunteer</th></tr></thead><tbody>';
  for(const p of d.players||[]){
    players+=`<tr><td>${playerLink(p.name,p.public_id)}</td><td>TH${p.th}</td><td>${p.wars}</td><td>${p.attacks}</td><td class="${p.missed_attacks>0?'bad':''}">${p.missed_attacks}</td><td>${p.triples}</td><td>${pct(p.triple_rate)}%</td><td>${p.current_no_miss_war_streak}</td><td>${p.current_triple_streak}</td><td>${p.volunteer_attacks}</td></tr>`;
  }
  players+='</tbody></table><div class="record-note">Streaks and records are based only on data collected by this tracker.</div></div>';
  document.getElementById('players').innerHTML=players;

  renderCompare();
  document.getElementById('cwl').innerHTML='<h1>CWL</h1><div class="card">CWL stays separate and will be added next.</div>';
  bindPlayerLinks();
  routeFromHash();
}

function compareRow(label,a,b,format=x=>x){
  return `<div class="compare-stat"><div><b>${format(a)}</b></div><div class="mid">${esc(label)}</div><div class="right"><b>${format(b)}</b></div></div>`;
}
function renderCompare(){
  const ps=DATA?.players||[];
  let h='<h1>Player vs Player</h1><div class="card">';
  if(ps.length<2){h+='<div class="empty">Need at least two players.</div></div>';document.getElementById('compare').innerHTML=h;return;}
  const opts=ps.map(p=>`<option value="${esc(p.public_id)}">${esc(p.name)}</option>`).join('');
  h+=`<div class="compare-controls"><div><div class="kicker">Player 1</div><select id="compareA">${opts}</select></div><div class="compare-vs">VS</div><div><div class="kicker">Player 2</div><select id="compareB">${opts}</select></div></div><div id="compareResult" style="margin-top:20px"></div></div>`;
  document.getElementById('compare').innerHTML=h;
  const a=document.getElementById('compareA'),b=document.getElementById('compareB');
  if(ps.length>1)b.selectedIndex=1;
  const draw=()=>{
    const pa=ps.find(x=>x.public_id===a.value),pb=ps.find(x=>x.public_id===b.value);
    let x=`<div class="row between"><div class="compare-name">${playerLink(pa.name,pa.public_id)}</div><div class="muted">Compared objectively — no overall winner score</div><div class="compare-name">${playerLink(pb.name,pb.public_id)}</div></div><div style="margin-top:15px">`;
    x+=compareRow('Wars',pa.wars,pb.wars);
    x+=compareRow('Attacks',pa.attacks,pb.attacks);
    x+=compareRow('Triple Rate',pa.triple_rate,pb.triple_rate,v=>pct(v)+'%');
    x+=compareRow('Avg Stars',pa.avg_stars,pb.avg_stars,v=>avg(v));
    x+=compareRow('Avg Destruction',pa.avg_destruction,pb.avg_destruction,v=>pct(v)+'%');
    x+=compareRow('Missed Attacks',pa.missed_attacks,pb.missed_attacks);
    x+=compareRow('Current No-Miss Streak',pa.current_no_miss_war_streak,pb.current_no_miss_war_streak);
    x+=compareRow('Best No-Miss Streak',pa.best_no_miss_war_streak,pb.best_no_miss_war_streak);
    x+=compareRow('Current Triple Streak',pa.current_triple_streak,pb.current_triple_streak);
    x+=compareRow('Best Triple Streak',pa.best_triple_streak,pb.best_triple_streak);
    x+=compareRow('Perfect Wars',pa.perfect_wars,pb.perfect_wars);
    x+=compareRow('Filler Wars',pa.filler_wars,pb.filler_wars);
    x+=compareRow('Volunteer Attacks',pa.volunteer_attacks,pb.volunteer_attacks);
    x+=compareRow('Volunteer Triples',pa.volunteer_triples,pb.volunteer_triples);
    x+='</div>';
    document.getElementById('compareResult').innerHTML=x;bindPlayerLinks();
  };
  a.addEventListener('change',draw);b.addEventListener('change',draw);draw();
}

function renderPlayerProfile(id){
  if(!DATA)return;
  const p=(DATA.player_profiles||{})[id];
  if(!p){showSection('players');return;}
  let profile=`<a class="back-link" href="#" id="backPlayers">← Back to Players</a>
  <h1 style="margin-bottom:5px">${esc(p.name)}</h1><div class="muted">TH${p.th} · Regular War History</div>
  <div class="grid" style="margin-top:18px">
    <div class="card s3"><div class="kicker">Wars</div><div class="big">${p.wars}</div></div>
    <div class="card s3"><div class="kicker">Attacks</div><div class="big">${p.attacks}</div></div>
    <div class="card s3"><div class="kicker">Triples</div><div class="big">${p.triples}</div><div class="muted">${pct(p.triple_rate)}%</div></div>
    <div class="card s3"><div class="kicker">Missed</div><div class="big">${p.missed_attacks}</div></div>
  </div>
  <h2>Current Streaks</h2><div class="grid">
    <div class="card s6"><div class="kicker">Wars Without a Miss</div><div class="big">${p.current_no_miss_war_streak}</div></div>
    <div class="card s6"><div class="kicker">Consecutive Triples</div><div class="big">${p.current_triple_streak}</div></div>
  </div>
  <h2>Personal Bests</h2><div class="grid">
    <div class="card s3"><div class="kicker">Longest No-Miss Streak</div><div class="big">${p.best_no_miss_war_streak}</div></div>
    <div class="card s3"><div class="kicker">Longest Triple Streak</div><div class="big">${p.best_triple_streak}</div></div>
    <div class="card s3"><div class="kicker">Perfect 6★ Wars</div><div class="big">${p.perfect_wars}</div></div>
    <div class="card s3"><div class="kicker">Best War Stars</div><div class="big">${p.best_war_stars}</div></div>
  </div>
  <div class="record-note">Filler wars count as clean no-miss wars because fillers have no attack obligation. Volunteer attacks are tracked separately and also remain part of normal career stats. Records are since tracking began.</div>
  <h2>Filler Contributions</h2><div class="grid">
    <div class="card s3"><div class="kicker">Filler Wars</div><div class="big">${p.filler_wars}</div></div>
    <div class="card s3"><div class="kicker">Volunteer Attacks</div><div class="big">${p.volunteer_attacks}</div></div>
    <div class="card s3"><div class="kicker">Volunteer Triples</div><div class="big">${p.volunteer_triples}</div><div class="muted">${pct(p.volunteer_triple_rate)}%</div></div>
    <div class="card s3"><div class="kicker">Volunteer Stars</div><div class="big">${p.volunteer_stars}</div></div>
  </div>
  <div class="record-note">Volunteer attacks are attacks made while designated as a filler. They are appreciated contributions, not required attacks.</div>
  <h2>Career</h2><div class="grid">
    <div class="card s4"><div class="kicker">Average Stars</div><div class="big">${avg(p.avg_stars)}</div></div>
    <div class="card s4"><div class="kicker">Avg Destruction</div><div class="big">${pct(p.avg_destruction)}%</div></div>
    <div class="card s4"><div class="kicker">Star Distribution</div><div style="margin-top:10px">3★ ${p.triples} &nbsp; 2★ ${p.twos} &nbsp; 1★ ${p.ones} &nbsp; 0★ ${p.zeros}</div></div>
  </div><h2>War-by-War History</h2><div class="card">`;

  if(!(p.war_history||[]).length)profile+='<div class="empty">No history stored yet.</div>';
  for(const w of p.war_history||[]){
    const role=w.is_filler?'<span class="pill filler">Filler</span>':'<span class="pill">Normal</span>';
    const missed=w.state==='warEnded'?`<span class="${w.missed_attacks>0?'bad':''}">${w.missed_attacks} missed</span>`:`${Math.max(0,w.expected_attacks-w.attacks_used)} remaining`;
    let attacks='';
    for(const a of w.attacks||[])attacks+=`<span class="attack-chip"><b>A${a.number}: ${stars(a.stars)}</b> ${pct(a.destruction)}% <span class="muted">· ${esc(a.attack_type)}</span></span>`;
    if(!attacks)attacks='<span class="muted">No attacks recorded.</span>';
    profile+=`<div class="war-entry"><div class="row between"><div><b>vs ${esc(w.opponent_name)}</b><div class="muted small">${prettyDate(w.date)} · ${w.team_size}v${w.team_size} · TH${w.th}</div></div><div style="text-align:right"><div class="${resultClass(w.result)}"><b>${esc((w.result||w.state_label).toUpperCase())}</b> · ${w.our_stars}–${w.their_stars}</div><div style="margin-top:5px">${role}</div></div></div><div class="statbar" style="margin-top:12px"><div><span class="muted small">${w.is_filler?'Volunteer Attacks':'Used'}</span><br><b>${w.is_filler?w.attacks_used:`${w.attacks_used}/${w.expected_attacks}`}</b></div><div><span class="muted small">${w.is_filler?'Obligation':(w.state==='warEnded'?'Missed':'Status')}</span><br><b>${w.is_filler?'None':missed}</b></div></div><div style="margin-top:10px">${attacks}</div></div>`;
  }
  profile+='</div><div class="record-note">Targeting judgments and management flags remain private.</div>';
  document.getElementById('profile').innerHTML=profile;showSection('profile');
  document.getElementById('backPlayers')?.addEventListener('click',e=>{e.preventDefault();history.replaceState(null,'',location.pathname);showSection('players');});
}
function routeFromHash(){
  if(!DATA)return;
  const h=location.hash.replace(/^#/,'');
  if(h.startsWith('player='))renderPlayerProfile(decodeURIComponent(h.slice(7)));
}
window.addEventListener('hashchange',routeFromHash);

fetch('data.json?ts='+Date.now(),{cache:'no-store'})
.then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();})
.then(render)
