<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero Dive Bar — War Stats</title>
<style>
:root{
  --bg:#0c1118;--panel:#151c26;--panel2:#1b2431;--line:#2b3544;
  --text:#edf2f7;--muted:#8fa0b5;--accent:#8b5cf6;--accent2:#a78bfa;
  --good:#37c96b;--warn:#f2bd4c;--bad:#ff6b6b
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
header{background:#0c1118ee;position:sticky;top:0;border-bottom:1px solid var(--line);z-index:10}
.wrap{max-width:1100px;margin:auto;padding:18px 20px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#4f46e5);font-size:22px}
h1{font-size:30px;margin:0 0 18px} h2{font-size:21px;margin:28px 0 12px} h3{font-size:17px;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:12px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
nav button{border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:650}
nav button.active,nav button:hover{background:var(--panel);color:var(--text)}
main{max-width:1100px;margin:auto;padding:22px 20px 60px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}.s3{grid-column:span 3}
.kicker{text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-size:11px;font-weight:800}
.big{font-size:31px;font-weight:850;margin-top:5px}.score{font-size:42px;font-weight:900}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--panel2);font-size:12px}
.pill.filler{background:#3b2a16;color:#f2cc60}.pill.us{background:#173421;color:#73e59a}.pill.them{background:#3a2020;color:#ff9999}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
tr:last-child td{border-bottom:0}
.hide{display:none}.error{padding:14px;background:#321b1b;border:1px solid #693434;border-radius:10px}
.player-link{color:var(--text);font-weight:750;text-decoration:none;cursor:pointer}
.player-link:hover{color:var(--accent2);text-decoration:underline}
.back-link{display:inline-flex;align-items:center;gap:7px;color:var(--accent2);text-decoration:none;font-weight:700;margin-bottom:16px}
.back-link:hover{text-decoration:underline}
.war-entry{border-top:1px solid var(--line);padding:15px 0}.war-entry:first-child{border-top:0;padding-top:0}
.attack-chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);padding:8px 10px;border-radius:9px;margin:5px 7px 0 0}
.statbar{display:flex;gap:18px;flex-wrap:wrap}.statbar>div{min-width:110px}
.empty{padding:20px 0;color:var(--muted)}
.timeline{position:relative;margin-top:6px}.timeline:before{content:"";position:absolute;left:16px;top:10px;bottom:10px;width:2px;background:var(--line)}
.timeline-item{position:relative;padding:0 0 18px 46px}.timeline-item:last-child{padding-bottom:0}
.timeline-dot{position:absolute;left:9px;top:5px;width:16px;height:16px;border-radius:50%;background:var(--panel2);border:3px solid var(--line)}
.timeline-item.ours .timeline-dot{border-color:var(--good)}.timeline-item.theirs .timeline-dot{border-color:var(--bad)}
.timeline-score{font-weight:850}.compare-controls{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px;font-size:15px}
.compare-vs{padding-bottom:11px;color:var(--muted);font-weight:800}
.compare-name{font-size:20px;font-weight:850}.compare-stat{display:grid;grid-template-columns:1fr 130px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.compare-stat:first-child{border-top:0}.compare-stat .mid{text-align:center;color:var(--muted);font-size:12px;text-transform:uppercase}
.compare-stat .right{text-align:right}
.record-note{font-size:12px;color:var(--muted);margin-top:8px}
.player-topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.member-tabs{display:flex;gap:8px;flex-wrap:wrap}
.member-tabs button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);padding:9px 12px;border-radius:9px;cursor:pointer;font-weight:700}
.member-tabs button.active{color:var(--text);border-color:var(--accent2)}
.sort-divider{width:1px;height:28px;background:var(--line);margin:0 2px}
.sort-label{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em;font-weight:800}
.sort-chips{display:flex;gap:6px;flex-wrap:wrap}
.sort-chip{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 10px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:750}
.sort-chip:hover{color:var(--text);border-color:var(--accent2)}
.sort-chip.active{color:var(--text);background:var(--panel2);border-color:var(--accent2)}
.status-former{color:var(--warn)}

.countdown-card{overflow:hidden;position:relative}
.countdown-card:after{content:"";position:absolute;right:-35px;bottom:-55px;width:125px;height:125px;border:20px solid var(--line);border-radius:50%;opacity:.35}
.countdown-value{font-size:34px;font-weight:900;letter-spacing:.02em;margin-top:7px;position:relative;z-index:1}
.countdown-sub{margin-top:5px;color:var(--muted);font-size:13px;position:relative;z-index:1}
.countdown-live{display:inline-flex;align-items:center;gap:6px}
.countdown-live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}


.miss-link{border:0;background:transparent;color:var(--bad);font:inherit;font-weight:800;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.miss-link.zero{color:var(--text);text-decoration:none;cursor:default}
.modal-backdrop{position:fixed;inset:0;background:#0009;z-index:50;display:grid;place-items:center;padding:20px}
.modal{width:min(520px,100%);max-height:80vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 24px 70px #0008}
.modal-close{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:8px 11px;cursor:pointer}
.cwl-banner{border-color:#56458f;background:linear-gradient(135deg,#211936,#151c26)}
.cwl-us{background:#1a2a22}
.attack-table td:first-child{white-space:nowrap}
.click-note{font-size:11px;color:var(--muted);margin-top:4px}

@media(max-width:760px){
  .s8,.s6,.s4,.s3{grid-column:span 12}.score{font-size:34px}
  table{display:block;overflow-x:auto}
  .compare-controls{grid-template-columns:1fr}.compare-vs{text-align:center;padding:0}
  .compare-stat{grid-template-columns:1fr 90px 1fr}
}
</style>
</head>
<body>
<header>
<div class="wrap">
  <div class="row between">
    <div class="brand"><div class="logo">⚔</div><div><b>Hero Dive Bar</b><div class="muted small">Public War Dashboard</div></div></div>
    <div id="updated" class="muted small">Loading…</div>
  </div>
  <nav>
    <button class="active" data-tab="home">Dashboard</button>
    <button data-tab="wars">Regular Wars</button>
    <button data-tab="players">Players</button>
    <button data-tab="compare">Compare</button>
    <button data-tab="cwl">CWL</button>
  </nav>
</div>
</header>
<main>
<div id="error"></div>
<section id="home"></section>
<section id="wars" class="hide"></section>
<section id="players" class="hide"></section>
<section id="compare" class="hide"></section>
<section id="cwl" class="hide"></section>
<section id="profile" class="hide"></section>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pct=n=>Number(n||0).toFixed(1);
const avg=n=>Number(n||0).toFixed(2);
const stars=n=>'★'.repeat(Number(n||0))+'☆'.repeat(Math.max(0,3-Number(n||0)));
let DATA=null;
let MISSED_BY_KEY={};
let ACTIVE_COUNTDOWN_WARS={};
let WAR_COUNTDOWN_TIMER=null;

function showSection(id){
  document.querySelectorAll('main section').forEach(x=>x.classList.add('hide'));
  document.getElementById(id)?.classList.remove('hide');
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));
}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{
  history.replaceState(null,'',location.pathname);showSection(b.dataset.tab);
}));

const playerLink=(name,id)=>`<a class="player-link" href="#player=${encodeURIComponent(id)}" data-player-id="${esc(id)}">${esc(name)}</a>`;
function bindPlayerLinks(){
  document.querySelectorAll('[data-player-id]').forEach(a=>a.addEventListener('click',e=>{
    e.preventDefault();document.getElementById('missModal')?.remove();location.hash=`player=${encodeURIComponent(a.dataset.playerId)}`;renderPlayerProfile(a.dataset.playerId);
  }));
}
function prettyDate(v){return (!v||v.length<8)?(v||'—'):`${v.slice(4,6)}/${v.slice(6,8)}/${v.slice(0,4)}`;}
function resultClass(r){return r==='win'?'good':r==='loss'?'bad':'';}

function registerMissed(x){if(x?.war_key)MISSED_BY_KEY[x.war_key]={title:`vs ${x.opponent_name||'Opponent'}`,players:x.missed_players||[]};}
function missedCell(x){
  registerMissed(x);
  const n=Number(x?.missed_attacks||0);
  if(!n)return '<span>0</span>';
  return `<button class="miss-link" data-missed-key="${esc(x.war_key)}">${n}</button>`;
}
function bindMissLinks(){document.querySelectorAll('[data-missed-key]').forEach(b=>b.addEventListener('click',()=>showMissed(b.dataset.missedKey)));}
function showMissed(key){
  const info=MISSED_BY_KEY[key]||{title:'War',players:[]};
  let rows='';
  for(const p of info.players)rows+=`<tr><td>${playerLink(p.name,p.public_id)}</td><td>TH${p.th??'—'}</td><td>${p.map_position?`#${p.map_position}`:'—'}</td><td class="bad"><b>${p.missed_attacks}</b></td></tr>`;
  if(!rows)rows='<tr><td colspan="4" class="muted">No missed attacks recorded.</td></tr>';
  const el=document.createElement('div');el.className='modal-backdrop';el.id='missModal';
  el.innerHTML=`<div class="modal"><div class="row between"><div><div class="kicker">Missed attacks</div><h2 style="margin:5px 0 0">${esc(info.title)}</h2></div><button class="modal-close" id="closeMiss">Close</button></div><div class="card" style="margin-top:16px;padding:8px 12px"><table><thead><tr><th>Player</th><th>TH</th><th>War #</th><th>Missed</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  document.body.appendChild(el);document.getElementById('closeMiss').onclick=()=>el.remove();el.addEventListener('click',e=>{if(e.target===el)el.remove();});bindPlayerLinks();
}

function renderTimeline(w){
  const t=w?.timeline||[];let h='<h2>War Timeline</h2><div class="card">';
  if(!t.length)return h+'<div class="empty">No attacks yet. The timeline will build automatically during Battle Day.</div></div>';
  h+='<div class="timeline">';
  for(const e of t){
    const ours=e.side==='clan';const who=ours&&e.attacker_public_id?playerLink(e.attacker_name,e.attacker_public_id):esc(e.attacker_name);
    h+=`<div class="timeline-item ${ours?'ours':'theirs'}"><div class="timeline-dot"></div><div class="row between"><div><span class="pill ${ours?'us':'them'}">${ours?'Hero Dive Bar':'Opponent'}</span><b style="margin-left:7px">${who}</b> <span class="muted">#${e.attacker_position} → #${e.defender_position}</span></div><div class="timeline-score">${e.our_score_after}–${e.their_score_after}</div></div><div style="margin-top:6px">${stars(e.stars)} <b>${pct(e.destruction)}%</b><span class="muted"> · ${esc(e.attack_type)}${e.new_stars?` · +${e.new_stars} war star${e.new_stars===1?'':'s'}`:''}</span></div></div>`;
  }
  return h+'</div></div>';
}
function formatCountdown(ms){if(!Number.isFinite(ms)||ms<=0)return'00h 00m 00s';let t=Math.floor(ms/1000),d=Math.floor(t/86400);t%=86400;const h=Math.floor(t/3600);t%=3600;const m=Math.floor(t/60),s=t%60;return`${d?d+'d ':''}${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;}
function localDateTime(v){if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleString();}
function countdownCard(w,key='war'){
  if(!w)return'';ACTIVE_COUNTDOWN_WARS[key]=w;
  return `<div class="card s12 countdown-card" data-countdown-key="${esc(key)}"><div class="row between"><div><div class="kicker countdown-live" data-countdown-label>War Timer</div><div class="countdown-value" data-countdown-value>Calculating…</div><div class="countdown-sub" data-countdown-sub></div></div><div class="muted small" data-countdown-phase>${esc(w.state_label)}</div></div></div>`;
}
function updateWarCountdown(){
  document.querySelectorAll('[data-countdown-key]').forEach(card=>{
    const key=card.dataset.countdownKey,w=ACTIVE_COUNTDOWN_WARS[key];if(!w)return;
    const label=card.querySelector('[data-countdown-label]'),value=card.querySelector('[data-countdown-value]'),sub=card.querySelector('[data-countdown-sub]'),phase=card.querySelector('[data-countdown-phase]');
    if(!label||!value)return;
    const now=Date.now(),start=new Date(w.start_time||'').getTime(),end=new Date(w.end_time||'').getTime();
    if(Number.isFinite(start)&&now<start){label.textContent='Battle Day Starts In';value.textContent=formatCountdown(start-now);sub.textContent=`Battle Day starts ${localDateTime(w.start_time)}`;phase.textContent='Preparation Day';return;}
    if(Number.isFinite(end)&&now<end){label.textContent='War Ends In';value.textContent=formatCountdown(end-now);sub.textContent=`Battle Day ends ${localDateTime(w.end_time)}`;phase.textContent='Battle Day';return;}
    label.textContent='War Status';value.textContent='War Ended';sub.textContent=w.end_time?`Ended ${localDateTime(w.end_time)}`:'';phase.textContent='War Ended';
  });
}
function startWarCountdown(){if(WAR_COUNTDOWN_TIMER)clearInterval(WAR_COUNTDOWN_TIMER);updateWarCountdown();WAR_COUNTDOWN_TIMER=setInterval(updateWarCountdown,1000);}

function rosterTable(w,isCwl=false){
  if(!w)return'';let h=`<h2>${isCwl?'Selected Roster':'Current War Roster'}</h2><div class="card"><table><thead><tr><th>#</th><th>Player</th><th>TH</th>${isCwl?'':'<th>Status</th>'}<th>Used</th><th>Expected</th><th>${w.state==='warEnded'?'Missed':'Remaining'}</th></tr></thead><tbody>`;
  for(const p of w.roster||[]){const status=p.is_filler?'<span class="pill filler">Filler</span>':'<span class="pill">Normal</span>';const finalCol=w.state==='warEnded'?p.missed_attacks:p.remaining_attacks;const cls=finalCol>0&&!p.is_filler?(w.state==='warEnded'?'bad':'warn'):'';h+=`<tr><td>#${p.map_position}</td><td>${playerLink(p.name,p.public_id)}</td><td>TH${p.th}</td>${isCwl?'':`<td>${status}</td>`}<td>${p.attacks_used}</td><td>${p.expected_attacks}</td><td class="${cls}">${finalCol}</td></tr>`;}
  return h+'</tbody></table></div>';
}

function opponentRosterTable(w){
  if(!w)return'';let h='<h2>Opponent Lineup</h2><div class="card"><table><thead><tr><th>#</th><th>Player</th><th>TH</th></tr></thead><tbody>';
  for(const p of w.opponent_roster||[])h+=`<tr><td>#${p.map_position??'—'}</td><td>${esc(p.name)}</td><td>TH${p.th??'—'}</td></tr>`;
  return h+'</tbody></table><div class="record-note">Actual opponent lineup returned for this CWL round during Preparation Day.</div></div>';
}

function renderRegularDashboard(d){
  const w=d.current_war,rec=d.clan?.records||{};let h='<h1>Dashboard</h1>';
  if(w){h+=`<div class="grid"><div class="card s8"><div class="kicker">${esc(w.state_label)} · ${w.team_size}v${w.team_size}</div><h2 style="margin-top:8px">${esc(w.clan_name)} <span class="muted">vs</span> ${esc(w.opponent_name)}</h2><div class="row"><div><div class="score">${w.clan_stars} ★</div><div class="muted">${Number(w.clan_destruction).toFixed(2)}%</div></div><div class="muted">—</div><div><div class="score">${w.opponent_stars} ★</div><div class="muted">${Number(w.opponent_destruction).toFixed(2)}%</div></div></div></div><div class="card s4"><div class="kicker">Expected clan attacks</div><div class="big">${w.attacks_used} / ${w.expected_attacks}</div><div class="muted">${w.fillers} filler${w.fillers===1?'':'s'} excluded.</div><div style="margin-top:10px"><b>${w.remaining_attacks}</b> required attacks remaining</div><div class="muted small" style="margin-top:5px">Volunteer filler attacks: ${w.volunteer_attacks||0}</div></div>${countdownCard(w,'regular')}</div>`;}
  else h+='<div class="card">No active regular war stored.</div>';
  h+=`<h2>Clan Streaks</h2><div class="grid"><div class="card s6"><div class="kicker">Longest Win Streak</div><div class="big">${rec.longest_win_streak||0}</div><div class="record-note">Consecutive completed regular-war wins since tracking began.</div></div><div class="card s6"><div class="kicker">Current Win Streak</div><div class="big">${rec.current_win_streak||0}</div><div class="record-note">${rec.completed_wars_tracked||0} completed regular wars tracked.</div></div></div>`;
  if(w){h+=rosterTable(w,false)+renderTimeline(w);}
  h+='<h2>Recent Results</h2><div class="card">';
  if(!(d.recent_wars||[]).length)h+='<div class="empty">No completed regular wars recorded yet.</div>';else h+='<table><thead><tr><th>Opponent</th><th>Size</th><th>Score</th><th>Fillers</th><th>Missed</th><th>Result</th></tr></thead><tbody>';
  for(const x of d.recent_wars||[])h+=`<tr><td>${esc(x.opponent_name)}</td><td>${x.team_size}v${x.team_size}</td><td>${x.clan_stars}–${x.opponent_stars}</td><td>${x.filler_count}</td><td>${missedCell(x)}</td><td class="${resultClass(x.result)}">${esc((x.result||x.state_label).toUpperCase())}</td></tr>`;
  if((d.recent_wars||[]).length)h+='</tbody></table>';return h+'</div>';
}

function cwlStandingsTable(c){
  let h='<div class="card"><table><thead><tr><th>#</th><th>Clan</th><th>W-L</th><th>League Stars</th><th>Battle Stars</th><th>Avg Destruction</th></tr></thead><tbody>';
  for(const s of c.standings||[])h+=`<tr class="${s.is_us?'cwl-us':''}"><td><b>${s.position}</b></td><td>${s.is_us?'<b>':''}${esc(s.name)}${s.is_us?' · US</b>':''}</td><td>${s.wins}-${s.losses}${s.ties?`-${s.ties}`:''}</td><td><b>${s.league_stars}</b></td><td>${s.battle_stars}</td><td>${pct(s.avg_destruction)}%</td></tr>`;
  return h+'</tbody></table><div class="record-note">League Stars include the 10-star CWL win bonus for completed rounds.</div></div>';
}
function cwlRoundsTable(c){
  let h='<div class="card"><table><thead><tr><th>Round</th><th>Opponent</th><th>State</th><th>Stars</th><th>Destruction</th><th>Missed</th><th>Result</th></tr></thead><tbody>';
  for(const r of c.rounds||[]){h+=`<tr><td>R${r.round}</td><td>${esc(r.opponent_name||'TBD')}</td><td>${esc(r.state_label||'Not Started')}</td><td>${r.clan_stars!=null?`${r.clan_stars}–${r.opponent_stars}`:'—'}</td><td>${r.clan_destruction!=null?`${pct(r.clan_destruction)}%–${pct(r.opponent_destruction)}%`:'—'}</td><td>${r.war_key?missedCell(r):'—'}</td><td class="${resultClass(r.result)}">${esc((r.result||'—').toUpperCase())}</td></tr>`;}
  return h+'</tbody></table></div>';
}
function renderCwlWarSection(w,{title,showPrepLineups=false,showTimeline=false,key='cwl'}={}){
  if(!w)return'';
  let h=`<h2>${esc(title||`Round ${w.round}`)}</h2><div class="grid"><div class="card s8"><div class="kicker">${esc(w.state_label)} · ${w.team_size}v${w.team_size}</div><h2 style="margin-top:8px">Hero Dive Bar <span class="muted">vs</span> ${esc(w.opponent_name)}</h2><div class="row"><div><div class="score">${w.clan_stars} ★</div><div class="muted">${pct(w.clan_destruction)}%</div></div><div class="muted">—</div><div><div class="score">${w.opponent_stars} ★</div><div class="muted">${pct(w.opponent_destruction)}%</div></div></div></div><div class="card s4"><div class="kicker">Selected attacks</div><div class="big">${w.attacks_used} / ${w.expected_attacks}</div><div class="muted">One attack per selected player.</div><div style="margin-top:10px"><b>${w.remaining_attacks}</b> remaining</div></div>${countdownCard(w,key)}</div>`;
  h+=rosterTable(w,true);
  if(showPrepLineups)h+=opponentRosterTable(w);
  if(showTimeline)h+=renderTimeline(w);
  return h;
}
function renderCwlDashboard(c){
  let h='<h1>CWL Dashboard</h1>';
  h+=`<div class="card cwl-banner"><div class="row between"><div><div class="kicker">${esc(c.season||'Current Season')} · ${esc(c.league_name||'CWL')}</div><h2 style="margin:6px 0">Hero Dive Bar — Clan War League</h2><div class="muted">Battle Day and the next round's Preparation Day are tracked at the same time.</div></div><div style="text-align:right"><div class="kicker">Group Position</div><div class="big">${c.position?`#${c.position}`:'—'}</div></div></div></div>`;
  const battle=c.battle_war,prep=c.prep_war,primary=battle||prep||c.current_war,r=c.record||{};
  h+=`<div class="grid" style="margin-top:14px"><div class="card s3"><div class="kicker">Record</div><div class="big">${r.wins||0}-${r.losses||0}${r.ties?`-${r.ties}`:''}</div></div><div class="card s3"><div class="kicker">League</div><div class="big" style="font-size:22px">${esc(c.league_name||'CWL')}</div></div><div class="card s3"><div class="kicker">Battle Round</div><div class="big">${battle?.round?`R${battle.round}`:(primary?.round?`R${primary.round}`:'—')}</div></div><div class="card s3"><div class="kicker">Next Prep</div><div class="big">${prep?.round?`R${prep.round}`:'—'}</div></div></div>`;
  if(battle)h+=renderCwlWarSection(battle,{title:`Battle Day — Round ${battle.round}`,showTimeline:true,key:'cwl-battle'});
  if(prep)h+=renderCwlWarSection(prep,{title:battle?`Next Round Preparation — Round ${prep.round}`:`Preparation Day — Round ${prep.round}`,showPrepLineups:true,key:'cwl-prep'});
  if(!battle&&!prep&&primary)h+=renderCwlWarSection(primary,{title:`Round ${primary.round}`,showTimeline:true,key:'cwl-current'});
  if(!primary)h+='<h2>Current Round</h2><div class="card"><div class="empty">CWL group found. Waiting for a round matchup to become available.</div></div>';
  h+='<h2>Group Standings</h2>'+cwlStandingsTable(c)+'<h2>Rounds</h2>'+cwlRoundsTable(c);return h;
}
function renderCwlTab(c){
  if(!c?.enabled)return `<h1>CWL</h1><div class="card cwl-banner"><h2 style="margin-top:0">CWL Search / Matchmaking</h2><div class="muted">${esc(c?.message||'Waiting for the CWL league group. Once matchmaking finishes, this page will populate automatically.')}</div><div class="record-note">As soon as the API returns an active CWL group, the main Dashboard automatically switches to the CWL dashboard.</div></div>`;
  let h=`<h1>CWL — ${esc(c.season||'Current Season')}</h1><div class="grid"><div class="card s4"><div class="kicker">League</div><div class="big" style="font-size:24px">${esc(c.league_name)}</div></div><div class="card s4"><div class="kicker">Group Position</div><div class="big">${c.position?`#${c.position}`:'—'}</div></div><div class="card s4"><div class="kicker">Record</div><div class="big">${c.record?.wins||0}-${c.record?.losses||0}</div></div></div>`;
  const battle=c.battle_war,prep=c.prep_war,primary=battle||prep||c.current_war;
  if(battle)h+=renderCwlWarSection(battle,{title:`Battle Day — Round ${battle.round}`,showTimeline:true,key:'tab-battle'});
  if(prep)h+=renderCwlWarSection(prep,{title:battle?`Next Round Preparation — Round ${prep.round}`:`Preparation Day — Round ${prep.round}`,showPrepLineups:true,key:'tab-prep'});
  if(!battle&&!prep&&primary)h+=renderCwlWarSection(primary,{title:`Round ${primary.round}`,showTimeline:true,key:'tab-current'});
  h+='<h2>Group Standings</h2>'+cwlStandingsTable(c)+'<h2>Rounds</h2>'+cwlRoundsTable(c)+'<h2>CWL Players</h2><div class="card">';
  if(!(c.players||[]).length)h+='<div class="empty">No selected players stored yet.</div>';else{h+='<table><thead><tr><th>Player</th><th>TH</th><th>Selected</th><th>Attacks</th><th>Missed</th><th>Stars</th><th>3★</th><th>Avg Destruction</th></tr></thead><tbody>';for(const p of c.players)h+=`<tr><td>${playerLink(p.name,p.public_id)}</td><td>TH${p.th}</td><td>${p.selected_rounds}</td><td>${p.attacks}</td><td class="${p.missed_attacks?'bad':''}">${p.missed_attacks}</td><td>${p.stars}</td><td>${p.triples}</td><td>${pct(p.avg_destruction)}%</td></tr>`;h+='</tbody></table>';}
  return h+'</div>';
}

function render(d){
  DATA=d;MISSED_BY_KEY={};ACTIVE_COUNTDOWN_WARS={};document.getElementById('updated').textContent=d.generated_at?`Updated ${new Date(d.generated_at).toLocaleString()}`:'Updated';
  document.getElementById('home').innerHTML=d.dashboard_mode==='cwl'&&d.cwl?.enabled?renderCwlDashboard(d.cwl):renderRegularDashboard(d);
  let wars='<h1>Regular Wars</h1><div class="card"><table><thead><tr><th>Date</th><th>Opponent</th><th>Size</th><th>Stars</th><th>Destruction</th><th>Fillers</th><th>Missed</th><th>Result</th></tr></thead><tbody>';
  for(const x of d.wars||[])wars+=`<tr><td>${prettyDate(x.date)}</td><td>${esc(x.opponent_name)}</td><td>${x.team_size}v${x.team_size}</td><td>${x.clan_stars}–${x.opponent_stars}</td><td>${pct(x.clan_destruction)}%–${pct(x.opponent_destruction)}%</td><td>${x.filler_count}</td><td>${missedCell(x)}</td><td class="${resultClass(x.result)}">${esc((x.result||x.state_label).toUpperCase())}</td></tr>`;
  document.getElementById('wars').innerHTML=wars+'</tbody></table><div class="click-note">Click a red missed-attack number to see exactly who missed.</div></div>';
  renderPlayersTable();renderCompare();document.getElementById('cwl').innerHTML=renderCwlTab(d.cwl);bindPlayerLinks();bindMissLinks();routeFromHash();startWarCountdown();
}

function compareRow(label,a,b,format=x=>x){return `<div class="compare-stat"><div><b>${format(a)}</b></div><div class="mid">${esc(label)}</div><div class="right"><b>${format(b)}</b></div></div>`;}
let PLAYER_VIEW='current',PLAYER_SORT_FIELD='th',PLAYER_SORT_DIR='desc';
const SORT_FIELDS={th:{label:'TH',defaultDir:'desc'},attacks:{label:'Attacks',defaultDir:'desc'},wars:{label:'Wars',defaultDir:'desc'},triples:{label:'3★',defaultDir:'desc'},avg_destruction:{label:'Avg Destruction',defaultDir:'desc'},missed_attacks:{label:'Missed',defaultDir:'asc'},current_no_miss_war_streak:{label:'No-Miss Streak',defaultDir:'desc'},current_triple_streak:{label:'Triple Streak',defaultDir:'desc'},best_triple_streak:{label:'Best Triple',defaultDir:'desc'},name:{label:'Name',defaultDir:'asc'}};
function sortedPlayers(list){const a=[...(list||[])],n=v=>Number(v||0),byName=(x,y)=>String(x.name||'').localeCompare(String(y.name||''),undefined,{sensitivity:'base'});a.sort((x,y)=>{let cmp=PLAYER_SORT_FIELD==='name'?byName(x,y):n(x[PLAYER_SORT_FIELD])-n(y[PLAYER_SORT_FIELD]);if(PLAYER_SORT_DIR==='desc')cmp=-cmp;if(cmp===0&&PLAYER_SORT_FIELD!=='attacks')cmp=n(y.attacks)-n(x.attacks);if(cmp===0)cmp=byName(x,y);return cmp;});return a;}
function setPlayerSort(field){const cfg=SORT_FIELDS[field];if(!cfg)return;if(PLAYER_SORT_FIELD===field)PLAYER_SORT_DIR=PLAYER_SORT_DIR==='desc'?'asc':'desc';else{PLAYER_SORT_FIELD=field;PLAYER_SORT_DIR=cfg.defaultDir;}renderPlayersTable();}
function sortArrow(field){if(PLAYER_SORT_FIELD!==field)return'';return PLAYER_SORT_DIR==='desc'?' ↓':' ↑';}
function renderPlayersTable(){
  const current=DATA?.players||[],former=DATA?.former_players||[],source=PLAYER_VIEW==='former'?former:current,list=sortedPlayers(source);const chips=Object.entries(SORT_FIELDS).map(([key,cfg])=>`<button type="button" class="sort-chip ${PLAYER_SORT_FIELD===key?'active':''}" data-sort-field="${key}">${esc(cfg.label)}${sortArrow(key)}</button>`).join('');
  let h=`<h1>Players</h1><div class="player-topbar"><div class="member-tabs"><button type="button" id="currentMembersBtn" class="${PLAYER_VIEW==='current'?'active':''}">Current Members (${current.length})</button><button type="button" id="formerMembersBtn" class="${PLAYER_VIEW==='former'?'active':''}">Former Members (${former.length})</button></div><div class="sort-divider"></div><div class="sort-label">Sort</div><div class="sort-chips">${chips}</div></div><div class="card">`;
  if(!list.length)h+=`<div class="empty">${PLAYER_VIEW==='former'?'No former members yet.':'No current members found.'}</div>`;else{h+='<table><thead><tr><th>Player</th><th>TH</th><th>Wars</th><th>Attacks</th><th>Missed</th><th>3★</th><th>Avg Destruction</th><th>No-Miss Streak</th><th>Triple Streak</th><th>Volunteer</th></tr></thead><tbody>';for(const p of list)h+=`<tr><td>${playerLink(p.name,p.public_id)}${PLAYER_VIEW==='former'?' <span class="pill">Former</span>':''}</td><td>TH${p.th}</td><td>${p.wars}</td><td>${p.attacks}</td><td class="${p.missed_attacks>0?'bad':''}">${p.missed_attacks}</td><td>${p.triples}</td><td>${pct(p.avg_destruction)}%</td><td>${p.current_no_miss_war_streak}</td><td>${p.current_triple_streak}</td><td>${p.volunteer_attacks}</td></tr>`;h+='</tbody></table>';}
  document.getElementById('players').innerHTML=h+'</div>';document.getElementById('currentMembersBtn')?.addEventListener('click',()=>{PLAYER_VIEW='current';renderPlayersTable();});document.getElementById('formerMembersBtn')?.addEventListener('click',()=>{PLAYER_VIEW='former';renderPlayersTable();});document.querySelectorAll('[data-sort-field]').forEach(btn=>btn.addEventListener('click',()=>setPlayerSort(btn.dataset.sortField)));bindPlayerLinks();
}
function renderCompare(){
  const ps=DATA?.all_players||DATA?.players||[];let h='<h1>Player vs Player</h1><div class="card">';if(ps.length<2){document.getElementById('compare').innerHTML=h+'<div class="empty">Need at least two players.</div></div>';return;}const opts=ps.map(p=>`<option value="${esc(p.public_id)}">${esc(p.name)}</option>`).join('');h+=`<div class="compare-controls"><div><div class="kicker">Player 1</div><select id="compareA">${opts}</select></div><div class="compare-vs">VS</div><div><div class="kicker">Player 2</div><select id="compareB">${opts}</select></div></div><div id="compareResult" style="margin-top:20px"></div><div class="record-note">Comparison uses Regular War stats only. CWL stays separate.</div></div>`;document.getElementById('compare').innerHTML=h;const a=document.getElementById('compareA'),b=document.getElementById('compareB');if(ps.length>1)b.selectedIndex=1;const draw=()=>{const pa=ps.find(x=>x.public_id===a.value),pb=ps.find(x=>x.public_id===b.value);let x=`<div class="row between"><div class="compare-name">${playerLink(pa.name,pa.public_id)}</div><div class="muted">No overall winner score</div><div class="compare-name">${playerLink(pb.name,pb.public_id)}</div></div><div style="margin-top:15px">`;x+=compareRow('Wars',pa.wars,pb.wars)+compareRow('Attacks',pa.attacks,pb.attacks)+compareRow('Triple Rate',pa.triple_rate,pb.triple_rate,v=>pct(v)+'%')+compareRow('Avg Stars',pa.avg_stars,pb.avg_stars,v=>avg(v))+compareRow('Avg Destruction',pa.avg_destruction,pb.avg_destruction,v=>pct(v)+'%')+compareRow('Missed Attacks',pa.missed_attacks,pb.missed_attacks)+compareRow('Current No-Miss Streak',pa.current_no_miss_war_streak,pb.current_no_miss_war_streak)+compareRow('Best No-Miss Streak',pa.best_no_miss_war_streak,pb.best_no_miss_war_streak)+compareRow('Current Triple Streak',pa.current_triple_streak,pb.current_triple_streak)+compareRow('Best Triple Streak',pa.best_triple_streak,pb.best_triple_streak)+compareRow('Perfect Wars',pa.perfect_wars,pb.perfect_wars)+compareRow('Filler Wars',pa.filler_wars,pb.filler_wars)+compareRow('Volunteer Attacks',pa.volunteer_attacks,pb.volunteer_attacks)+compareRow('Volunteer Triples',pa.volunteer_triples,pb.volunteer_triples)+'</div>';document.getElementById('compareResult').innerHTML=x;bindPlayerLinks();};a.addEventListener('change',draw);b.addEventListener('change',draw);draw();
}
function attackRows(attacks,isCwl=false){
  if(!(attacks||[]).length)return'<div class="empty">No attacks recorded yet.</div>';let h='<table class="attack-table"><thead><tr><th>Date</th><th>War</th><th>Attack</th><th>Stars</th><th>Destruction</th><th>Type</th></tr></thead><tbody>';for(const a of attacks)h+=`<tr><td>${prettyDate(a.date)}</td><td>${isCwl&&a.round?`R${a.round} · `:''}vs ${esc(a.opponent_name)}</td><td>#${a.attacker_position??'—'} → #${a.defender_position??'—'}<div class="muted small">${a.attacker_th?`TH${a.attacker_th}`:''}${a.defender_th?` → TH${a.defender_th}`:''}</div></td><td><b>${stars(a.stars)}</b></td><td><b>${pct(a.destruction)}%</b></td><td>${esc(a.attack_type||'')}</td></tr>`;return h+'</tbody></table>';
}
function renderPlayerProfile(id){
  if(!DATA)return;const p=(DATA.player_profiles||{})[id];if(!p){showSection('players');return;}
  let profile=`<a class="back-link" href="#" id="backPlayers">← Back to Players</a><h1 style="margin-bottom:5px">${esc(p.name)}</h1><div class="muted">TH${p.th} · <span class="${p.currently_in_clan?'good':'status-former'}">${esc(p.membership_status||'Member')}</span></div><div class="grid" style="margin-top:18px"><div class="card s3"><div class="kicker">Regular Wars</div><div class="big">${p.wars}</div></div><div class="card s3"><div class="kicker">War Attacks</div><div class="big">${p.attacks}</div></div><div class="card s3"><div class="kicker">Triples</div><div class="big">${p.triples}</div><div class="muted">${pct(p.triple_rate)}%</div></div><div class="card s3"><div class="kicker">Missed</div><div class="big">${p.missed_attacks}</div></div></div>`;
  profile+=`<h2>War Attacks</h2><div class="card">${attackRows(p.recent_war_attacks||[],false)}</div><div class="record-note">Most recent Regular War attacks, including stars and destruction percentage.</div>`;
  if((p.recent_cwl_attacks||[]).length)profile+=`<h2>CWL Attacks</h2><div class="card">${attackRows(p.recent_cwl_attacks||[],true)}</div><div class="record-note">CWL attacks are shown separately and are not mixed into Regular War career stats.</div>`;
  profile+=`<h2>Current Streaks</h2><div class="grid"><div class="card s6"><div class="kicker">Wars Without a Miss</div><div class="big">${p.current_no_miss_war_streak}</div></div><div class="card s6"><div class="kicker">Consecutive Triples</div><div class="big">${p.current_triple_streak}</div></div></div><h2>Personal Bests</h2><div class="grid"><div class="card s3"><div class="kicker">Longest No-Miss Streak</div><div class="big">${p.best_no_miss_war_streak}</div></div><div class="card s3"><div class="kicker">Longest Triple Streak</div><div class="big">${p.best_triple_streak}</div></div><div class="card s3"><div class="kicker">Perfect 6★ Wars</div><div class="big">${p.perfect_wars}</div></div><div class="card s3"><div class="kicker">Best War Stars</div><div class="big">${p.best_war_stars}</div></div></div><div class="record-note">Regular War records only. CWL is separate.</div><h2>Filler Contributions</h2><div class="grid"><div class="card s3"><div class="kicker">Filler Wars</div><div class="big">${p.filler_wars}</div></div><div class="card s3"><div class="kicker">Volunteer Attacks</div><div class="big">${p.volunteer_attacks}</div></div><div class="card s3"><div class="kicker">Volunteer Triples</div><div class="big">${p.volunteer_triples}</div><div class="muted">${pct(p.volunteer_triple_rate)}%</div></div><div class="card s3"><div class="kicker">Volunteer Stars</div><div class="big">${p.volunteer_stars}</div></div></div><h2>Career</h2><div class="grid"><div class="card s4"><div class="kicker">Average Stars</div><div class="big">${avg(p.avg_stars)}</div></div><div class="card s4"><div class="kicker">Avg Destruction</div><div class="big">${pct(p.avg_destruction)}%</div></div><div class="card s4"><div class="kicker">Star Distribution</div><div style="margin-top:10px">3★ ${p.triples} &nbsp; 2★ ${p.twos} &nbsp; 1★ ${p.ones} &nbsp; 0★ ${p.zeros}</div></div></div><h2>War-by-War History</h2><div class="card">`;
  if(!(p.war_history||[]).length)profile+='<div class="empty">No regular-war history stored yet.</div>';
  for(const w of p.war_history||[]){const role=w.is_filler?'<span class="pill filler">Filler</span>':'<span class="pill">Normal</span>';const missed=w.state==='warEnded'?`<span class="${w.missed_attacks>0?'bad':''}">${w.missed_attacks} missed</span>`:`${Math.max(0,w.expected_attacks-w.attacks_used)} remaining`;let attacks='';for(const a of w.attacks||[])attacks+=`<span class="attack-chip"><b>A${a.number}: ${stars(a.stars)}</b> ${pct(a.destruction)}% <span class="muted">· ${esc(a.attack_type)}</span></span>`;if(!attacks)attacks='<span class="muted">No attacks recorded.</span>';profile+=`<div class="war-entry"><div class="row between"><div><b>vs ${esc(w.opponent_name)}</b><div class="muted small">${prettyDate(w.date)} · ${w.team_size}v${w.team_size} · TH${w.th}</div></div><div style="text-align:right"><div class="${resultClass(w.result)}"><b>${esc((w.result||w.state_label).toUpperCase())}</b> · ${w.our_stars}–${w.their_stars}</div><div style="margin-top:5px">${role}</div></div></div><div class="statbar" style="margin-top:12px"><div><span class="muted small">${w.is_filler?'Volunteer Attacks':'Used'}</span><br><b>${w.is_filler?w.attacks_used:`${w.attacks_used}/${w.expected_attacks}`}</b></div><div><span class="muted small">${w.is_filler?'Obligation':(w.state==='warEnded'?'Missed':'Status')}</span><br><b>${w.is_filler?'None':missed}</b></div></div><div style="margin-top:10px">${attacks}</div></div>`;}
  profile+='</div><div class="record-note">Targeting judgments and management flags remain private.</div>';document.getElementById('profile').innerHTML=profile;showSection('profile');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab==='players'));document.getElementById('backPlayers')?.addEventListener('click',e=>{e.preventDefault();history.replaceState(null,'',location.pathname);showSection('players');});
}
function routeFromHash(){if(!DATA)return;const h=location.hash.replace(/^#/,'');if(h.startsWith('player='))renderPlayerProfile(decodeURIComponent(h.slice(7)));}
window.addEventListener('hashchange',routeFromHash);
let LAST_DATA_VERSION=null;
function refreshPublicData(){fetch('data.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();}).then(d=>{document.getElementById('error').innerHTML='';const version=d.generated_at||JSON.stringify(d.current_war||{});if(DATA===null||version!==LAST_DATA_VERSION){LAST_DATA_VERSION=version;render(d);}}).catch(e=>document.getElementById('error').innerHTML=`<div class="error">Could not refresh dashboard data: ${esc(e.message)}</div>`);}
refreshPublicData();setInterval(refreshPublicData,60000);
</script>
